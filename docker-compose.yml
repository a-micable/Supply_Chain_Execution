version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nexusops
      POSTGRES_PASSWORD: nexusops_dev
      POSTGRES_DB: nexusops
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexusops"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build: .
    ports:
      - "8001:8000"
    environment:
      NEXUSOPS_DATABASE_URL: postgresql+asyncpg://nexusops:nexusops_dev@postgres:5432/nexusops
      NEXUSOPS_REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: .
    command: python -m nexusops.workers.runner
    environment:
      NEXUSOPS_DATABASE_URL: postgresql+asyncpg://nexusops:nexusops_dev@postgres:5432/nexusops
      NEXUSOPS_REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
